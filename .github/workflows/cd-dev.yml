name: CD (dev)

# Manual únicamente (AD-18 / AD-17): nunca se dispara por push/PR. Este es
# el primer `terraform apply` real contra Azure -- ver spec-1-4.
on:
  workflow_dispatch:

concurrency:
  # No se cancela un run en curso: un `terraform apply` interrumpido a la
  # mitad no tiene rollback automático (ver I/O & Edge-Case Matrix del
  # spec) -- mejor encolar el siguiente dispatch que cancelar este.
  group: cd-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Azure OIDC (azure/login + azurerm provider)
  packages: write # push de la imagen a GHCR con GITHUB_TOKEN

env:
  API_IMAGE: ghcr.io/antoniotamez/auto-api
  TF_WORKING_DIR: infra/terraform
  # Backend remoto real del state (bootstrap ya ejecutado esta sesión,
  # fuera de este workflow -- ver infra/terraform/README.md).
  TF_STATE_RESOURCE_GROUP: rg-auto-tfstate
  TF_STATE_STORAGE_ACCOUNT: stautotfstate
  TF_STATE_CONTAINER: tfstate
  TF_STATE_KEY: dev.tfstate
  # Consumidas por el provider azurerm para autenticarse vía OIDC federado
  # (App Registration `gh-actions-auto-cd`, ya configurada esta sesión) --
  # nunca un secreto de larga duración.
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  deploy-dev:
    name: deploy-dev
    # Code review: workflow_dispatch permite elegir cualquier rama -- sin
    # este guard, alguien podría desplegar código no probado a dev real.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # --- Imagen de la API: build + push a GHCR (público, sin PAT) -------
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Api/Dockerfile
          push: true
          # :dev es solo conveniencia humana (docker pull manual para
          # inspeccionar el último build) -- Terraform siempre despliega el
          # tag inmutable :sha, nunca este.
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:dev

      # --- Azure OIDC + terraform apply real -------------------------------
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Sin terraform_version fijo: usa el "latest" default de la action,
      # consistente con el required_version sin cota superior de
      # providers.tf (">= 1.9.0").
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ env.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ env.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}"

      # Code review: validar antes de aplicar -- el primer apply real contra
      # Azure no debería correr sin este gate estático.
      - name: terraform fmt -check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # Code review: plan guardado en archivo y aplicado desde ahí (en vez de
      # `apply -auto-approve` sobre un plan implícito) -- el plan queda
      # visible en el log del job antes de que se ejecute.
      - name: terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var "environment=dev" \
            -var "api_container_image=${{ env.API_IMAGE }}:${{ github.sha }}" \
            -out=tfplan

      - name: terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      # Output sensible -- se enmascara ANTES de escribirlo a GITHUB_OUTPUT
      # para que nunca aparezca en texto plano en los logs (AC de esta
      # historia). Formato multilínea-seguro (delimitador EOF) por si el
      # token alguna vez contiene un salto de línea.
      - name: Read Static Web App deploy token
        id: swa_token
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          token=$(terraform output -raw static_web_app_api_key)
          # Code review (segunda pasada): falla rápido con un mensaje claro
          # si el output vino vacío (state parcial/output inesperado) en vez
          # de dejar que el deploy de la SWA falle más adelante de forma
          # confusa con un token vacío.
          [ -n "$token" ] || { echo "::error::static_web_app_api_key vino vacío -- revisar el terraform apply anterior"; exit 1; }
          echo "::add-mask::$token"
          {
            echo "token<<SWA_TOKEN_EOF"
            echo "$token"
            echo "SWA_TOKEN_EOF"
          } >> "$GITHUB_OUTPUT"

      # El FQDN del Container App lo asigna Azure dinámicamente en este
      # apply (incluye un sufijo aleatorio del Container App Environment) --
      # no existe hasta ahora, así que no puede fijarse en el código fuente
      # commiteado ni vía `fileReplacements` de Angular (ver Design Notes de
      # spec 1.5). Se sobreescribe justo antes del build, con el FQDN real
      # de este mismo despliegue.
      - name: Inject real API FQDN into Angular environment
        run: |
          fqdn=$(terraform -chdir=${{ env.TF_WORKING_DIR }} output -raw container_app_fqdn)
          [ -n "$fqdn" ] || { echo "::error::container_app_fqdn vino vacío -- revisar el terraform apply anterior"; exit 1; }
          cat > web/src/environments/environment.ts <<EOF
          export const environment = {
            apiBaseUrl: 'https://$fqdn',
          };
          EOF
          echo "web/src/environments/environment.ts actualizado con apiBaseUrl=https://$fqdn"
          echo "INJECTED_API_FQDN=$fqdn" >> "$GITHUB_ENV"

      # --- Build de Angular + deploy a Static Web App ----------------------
      - name: Setup Node.js (from web/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: npm run build
        working-directory: web
        run: npm run build

      # Code review (segunda pasada, spec 1.5): sin esto, si el step de
      # inyección del FQDN se saltara o reordenara después del build, el
      # sitio desplegado apuntaría silenciosamente a localhost -- nada más
      # en el pipeline lo detectaría.
      - name: Verify FQDN injection took effect in build output
        working-directory: web
        run: |
          grep -rq "$INJECTED_API_FQDN" dist/web/browser \
            || { echo "::error::El FQDN inyectado ($INJECTED_API_FQDN) no aparece en dist/web/browser -- ¿se saltó o reordenó el step de inyección antes del build?"; exit 1; }
          echo "apiBaseUrl=https://$INJECTED_API_FQDN confirmado en el build de producción"

      # navigationFallback (SPA routing) solo lo respeta Azure Static Web
      # Apps si el config vive junto al contenido desplegado, no en la raíz
      # del repo -- ver web/staticwebapp.config.json.
      #
      # Code review (segunda pasada): chequeo explícito antes del cp -- un
      # cambio de nombre del proyecto Angular o de la config del builder
      # rompería este path silenciosamente con un error genérico de cp; esto
      # da un mensaje claro apuntando a la causa real.
      - name: Copy staticwebapp.config.json into build output
        run: |
          test -d web/dist/web/browser \
            || { echo "::error::web/dist/web/browser no existe -- ¿cambió el nombre del proyecto Angular o la config del builder?"; exit 1; }
          cp web/staticwebapp.config.json web/dist/web/browser/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web/dist/web/browser
          output_location: ''
          skip_app_build: true

      # Code review (segunda pasada): el check original solo verificaba que
      # la conexión TCP/TLS se estableciera (curl sin --fail), así que un
      # 502 del ingress -- justo la señal de un target_port mal configurado
      # -- contaba igual que un 404 legítimo del scaffold. Ahora inspecciona
      # el status code: tolera cualquier respuesta de la app (incluye
      # 3xx/4xx del scaffold sin endpoints reales todavía) pero rechaza
      # 502/503/504 (error de ingress/gateway, la app nunca respondió).
      # También verifica el Static Web App, no solo la API (AC de esta
      # historia: "el sitio carga").
      - name: Smoke check -- API and Static Web App reachable
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          fqdn=$(terraform output -raw container_app_fqdn)
          swa_host=$(terraform output -raw static_web_app_default_host_name)
          echo "Container App FQDN: https://$fqdn"
          echo "Static Web App host: https://$swa_host"
          {
            echo "### CD (dev) -- deploy completo"
            echo "- API (Container App): https://$fqdn"
            echo "- Web (Static Web App): https://$swa_host"
          } >> "$GITHUB_STEP_SUMMARY"

          check_reachable() {
            local url="$1" label="$2" code
            code=$(curl --retry 5 --retry-connrefused --retry-delay 10 \
              --max-time 15 -sS -o /dev/null -w "%{http_code}" "$url") \
              || { echo "::error::No se pudo establecer conexión con $label ($url)"; exit 1; }
            case "$code" in
              502|503|504)
                echo "::error::$label respondió $code (error de ingress/gateway, no de la app) -- revisar target_port vs ASPNETCORE_HTTP_PORTS ($url)"
                exit 1
                ;;
            esac
            echo "$label respondió HTTP $code"
          }

          check_reachable "https://$fqdn" "Container App"
          check_reachable "https://$swa_host" "Static Web App"
