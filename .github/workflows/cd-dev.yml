name: CD (dev)

# Manual únicamente (AD-18 / AD-17): nunca se dispara por push/PR. Este es
# el primer `terraform apply` real contra Azure -- ver spec-1-4.
on:
  workflow_dispatch:

concurrency:
  # No se cancela un run en curso: un `terraform apply` interrumpido a la
  # mitad no tiene rollback automático (ver I/O & Edge-Case Matrix del
  # spec) -- mejor encolar el siguiente dispatch que cancelar este.
  group: cd-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Azure OIDC (azure/login + azurerm provider)
  packages: write # push de la imagen a GHCR con GITHUB_TOKEN

env:
  API_IMAGE: ghcr.io/antoniotamez/auto-api
  TF_WORKING_DIR: infra/terraform
  # Backend remoto real del state (bootstrap ya ejecutado esta sesión,
  # fuera de este workflow -- ver infra/terraform/README.md).
  TF_STATE_RESOURCE_GROUP: rg-auto-tfstate
  TF_STATE_STORAGE_ACCOUNT: stautotfstate
  TF_STATE_CONTAINER: tfstate
  TF_STATE_KEY: dev.tfstate
  # Consumidas por el provider azurerm para autenticarse vía OIDC federado
  # (App Registration `gh-actions-auto-cd`, ya configurada esta sesión) --
  # nunca un secreto de larga duración.
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  deploy-dev:
    name: deploy-dev
    # Code review: workflow_dispatch permite elegir cualquier rama -- sin
    # este guard, alguien podría desplegar código no probado a dev real.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # --- Imagen de la API: build + push a GHCR (público, sin PAT) -------
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Api/Dockerfile
          push: true
          # :dev es solo conveniencia humana (docker pull manual para
          # inspeccionar el último build) -- Terraform siempre despliega el
          # tag inmutable :sha, nunca este.
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:dev

      # --- Azure OIDC + terraform apply real -------------------------------
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Sin terraform_version fijo: usa el "latest" default de la action,
      # consistente con el required_version sin cota superior de
      # providers.tf (">= 1.9.0").
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ env.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ env.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}"

      # Code review: validar antes de aplicar -- el primer apply real contra
      # Azure no debería correr sin este gate estático.
      - name: terraform fmt -check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # Code review: plan guardado en archivo y aplicado desde ahí (en vez de
      # `apply -auto-approve` sobre un plan implícito) -- el plan queda
      # visible en el log del job antes de que se ejecute.
      - name: terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var "environment=dev" \
            -var "api_container_image=${{ env.API_IMAGE }}:${{ github.sha }}" \
            -out=tfplan

      - name: terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      # Output sensible -- se enmascara ANTES de escribirlo a GITHUB_OUTPUT
      # para que nunca aparezca en texto plano en los logs (AC de esta
      # historia). Formato multilínea-seguro (delimitador EOF) por si el
      # token alguna vez contiene un salto de línea.
      - name: Read Static Web App deploy token
        id: swa_token
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          token=$(terraform output -raw static_web_app_api_key)
          echo "::add-mask::$token"
          {
            echo "token<<SWA_TOKEN_EOF"
            echo "$token"
            echo "SWA_TOKEN_EOF"
          } >> "$GITHUB_OUTPUT"

      # --- Build de Angular + deploy a Static Web App ----------------------
      - name: Setup Node.js (from web/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: npm run build
        working-directory: web
        run: npm run build

      # navigationFallback (SPA routing) solo lo respeta Azure Static Web
      # Apps si el config vive junto al contenido desplegado, no en la raíz
      # del repo -- ver web/staticwebapp.config.json.
      - name: Copy staticwebapp.config.json into build output
        run: cp web/staticwebapp.config.json web/dist/web/browser/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web/dist/web/browser
          output_location: ''
          skip_app_build: true

      # Code review: nada verificaba antes que el esqueleto quedara
      # realmente alcanzable -- este check tolera cold-start (min_replicas=0)
      # y cualquier respuesta HTTP (incluye redirects/404 del scaffold sin
      # endpoints reales todavía); solo falla si la conexión nunca se
      # establece, que es la señal real de un target_port mal configurado.
      - name: Smoke check -- Container App reachable
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          fqdn=$(terraform output -raw container_app_fqdn)
          swa_host=$(terraform output -raw static_web_app_default_host_name)
          echo "Container App FQDN: https://$fqdn"
          echo "Static Web App host: https://$swa_host"
          {
            echo "### CD (dev) -- deploy completo"
            echo "- API (Container App): https://$fqdn"
            echo "- Web (Static Web App): https://$swa_host"
          } >> "$GITHUB_STEP_SUMMARY"
          # Sin --fail: cualquier respuesta HTTP (incluidos 3xx/4xx) cuenta
          # como "alcanzable" -- solo un fallo de conexión (refused/timeout)
          # hace que curl salga con código != 0 aquí.
          curl --retry 5 --retry-connrefused --retry-delay 10 \
            --max-time 15 -sS -o /dev/null "https://$fqdn" \
            || { echo "::error::No se pudo establecer conexión con el Container App -- revisar target_port vs ASPNETCORE_HTTP_PORTS"; exit 1; }
