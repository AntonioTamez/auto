name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v6

      - name: dotnet restore
        run: dotnet restore Auto.slnx

      - name: dotnet build
        run: dotnet build Auto.slnx --no-restore --configuration Release

      - name: dotnet test
        run: dotnet test Auto.slnx --no-build --configuration Release

      # Publica el contrato OpenAPI (generado build-time por Api.csproj,
      # historia 1.7) como artefacto versionado del pipeline -- mismo
      # esquema de versionado por commit SHA que cd-dev.yml usa para el
      # tag de la imagen Docker. Angular (y luego Flutter) construyen
      # contra este contrato, no contra código leído a mano.
      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-${{ github.sha }}
          path: src/Api/obj/openapi/Api.json
          if-no-files-found: error

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js (from web/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: npm test
        run: npm test
